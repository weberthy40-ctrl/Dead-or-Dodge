name: Publicar site de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
        env:
          CHROME_BIN: google-chrome
          QA_NO_SANDBOX: '1'
          QA_ARTIFACT_DIR: artifacts/qa/ci
      - name: Guardar diagnóstico de QA em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: artifacts/qa/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
