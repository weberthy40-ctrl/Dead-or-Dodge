name: Validar candidato
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
        env:
          CHROME_BIN: google-chrome
          QA_NO_SANDBOX: '1'
          QA_ARTIFACT_DIR: artifacts/qa/ci
      - name: Guardar diagnóstico de QA em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: artifacts/qa/
          if-no-files-found: ignore
